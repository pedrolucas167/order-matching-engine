name: Test and publish order service

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: true
      - name: Test concurrency and financial recovery
        run: go test -race -coverprofile=coverage.out ./...
      - name: Enforce total statement coverage
        run: |
          go tool cover -func=coverage.out
          python3 - <<'PY'
          from pathlib import Path
          total = covered = 0
          for line in Path("coverage.out").read_text().splitlines()[1:]:
              _, statements, count = line.rsplit(" ", 2)
              total += int(statements)
              covered += int(statements) if int(count) else 0
          if not total or covered * 100 < total * 95:
              raise SystemExit("Total statement coverage must be at least 95%")
          print(f"Total coverage: {covered / total:.2%}")
          PY
      - name: Check source and dependencies
        run: |
          go vet ./...
          go mod verify
      - name: Build service image
        run: docker build --platform linux/amd64 --build-arg REVISION="$GITHUB_SHA" -t order-matching-engine:ci .
      - name: Verify real container replacement and persistence
        env:
          ORDER_CONTAINER_IMAGE: order-matching-engine:ci
        run: go test -run '^TestContainerService' -v ./internal/server
      - name: Save verified image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: docker save order-matching-engine:ci -o order-service.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          name: order-service-image
          path: order-service.tar
          compression-level: 0
          retention-days: 1

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: order-service-image
          path: image
      - name: Load verified image
        run: docker load -i image/order-service.tar
      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish and verify image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag order-matching-engine:ci "$image:sha-$GITHUB_SHA"
          docker tag order-matching-engine:ci "$image:latest"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:latest"
          docker buildx imagetools inspect "$image:sha-$GITHUB_SHA"
          printf 'Published `%s:sha-%s` and `%s:latest`.\n' "$image" "$GITHUB_SHA" "$image" >> "$GITHUB_STEP_SUMMARY"
