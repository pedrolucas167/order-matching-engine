services:
  matching:
    image: ${ORDER_IMAGE:-ghcr.io/pedrolucas167/order-matching-engine:latest}
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ORDER_API_TOKEN: ${ORDER_API_TOKEN:?set ORDER_API_TOKEN before starting the service}
    volumes:
      - matching-data:/data
      - ./config/engine.example.json:/config/engine.json:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  matching-data:
